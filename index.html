<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Oranla Robo Danışman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Düzen: solda profil anketi, sağda sonuç. Dar ekranda alt alta. Vurgu tek yerde: profil adı ve dağılım halkası. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --surface2: #E3E8EE;
  --ink: #14212B;
  --muted: #52606D;
  --line: #CBD3DC;
  --accent: #0B5F6B;
  --accent-ink: #FFFFFF;
  --accent-soft: #D3EBEE;
  --good: #2E7D4F;
  --bad: #B5472F;
  --c-mevduat: #3F5F8F;
  --c-ppf: #1F8A8A;
  --c-borc: #7FA6D6;
  --c-hisse: #3E8E4F;
  --c-altin: #C28A12;
  --c-gumus: #8A949E;
  --c-doviz: #8A5A9E;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1519; --surface: #142027; --surface2: #1B2A33; --ink: #E6EEF2; --muted: #9AAAB5; --line: #2A3B46;
    --accent: #5CC4CF; --accent-ink: #06262B; --accent-soft: #143A40; --good: #6CC27C; --bad: #E08A72;
    --c-mevduat: #7D9FD1; --c-ppf: #4FC0BE; --c-borc: #9CBDE6; --c-hisse: #6CC27C; --c-altin: #E0A82E; --c-gumus: #AEB8C1; --c-doviz: #BE8FD0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1519; --surface: #142027; --surface2: #1B2A33; --ink: #E6EEF2; --muted: #9AAAB5; --line: #2A3B46;
  --accent: #5CC4CF; --accent-ink: #06262B; --accent-soft: #143A40; --good: #6CC27C; --bad: #E08A72;
  --c-mevduat: #7D9FD1; --c-ppf: #4FC0BE; --c-borc: #9CBDE6; --c-hisse: #6CC27C; --c-altin: #E0A82E; --c-gumus: #AEB8C1; --c-doviz: #BE8FD0;
  color-scheme: dark;
}

/* Renk paletleri: varsayılan turkuaz kök tanımda, diğerleri yalnızca vurgu tokenlarını değiştirir */
:root[data-palette="indigo"] { --accent: #3B4BA8; --accent-ink: #FFFFFF; --accent-soft: #DDE1F6; }
:root[data-palette="rose"] { --accent: #A8325A; --accent-ink: #FFFFFF; --accent-soft: #F6DCE5; }
:root[data-palette="graphite"] { --accent: #2F3B46; --accent-ink: #FFFFFF; --accent-soft: #DCE1E6; }
@media (prefers-color-scheme: dark) {
  :root[data-palette="indigo"]:not([data-theme="light"]) { --accent: #9AA6F0; --accent-ink: #10163A; --accent-soft: #232A57; }
  :root[data-palette="rose"]:not([data-theme="light"]) { --accent: #EE8BAE; --accent-ink: #3A0F20; --accent-soft: #4A1F31; }
  :root[data-palette="graphite"]:not([data-theme="light"]) { --accent: #C3CED8; --accent-ink: #11191F; --accent-soft: #2B3943; }
}
:root[data-palette="indigo"][data-theme="dark"] { --accent: #9AA6F0; --accent-ink: #10163A; --accent-soft: #232A57; }
:root[data-palette="rose"][data-theme="dark"] { --accent: #EE8BAE; --accent-ink: #3A0F20; --accent-soft: #4A1F31; }
:root[data-palette="graphite"][data-theme="dark"] { --accent: #C3CED8; --accent-ink: #11191F; --accent-soft: #2B3943; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 24px 48px; }
.app { max-width: 1120px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
p { margin: 0; }

.toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.top { display: flex; flex-direction: column; gap: 8px; max-width: 62ch; min-width: 0; }
.kicker { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.top h1 { font-size: clamp(26px, 4.2vw, 40px); font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
.top p { color: var(--muted); }

.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px; gap: 2px; flex: none; }
.lang button { font-family: var(--f-mono); font-size: 13px; font-weight: 500; letter-spacing: .06em; border: 0; background: transparent; color: var(--muted); padding: 6px 14px; border-radius: 5px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.lang button:not([aria-pressed="true"]):hover { color: var(--ink); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: flex-end; }
.swatches { display: inline-flex; gap: 10px; align-items: center; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0; background: var(--sw); cursor: pointer; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

.layout { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.panel h2 { font-size: 20px; font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }

.money { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 420px) { .money { grid-template-columns: minmax(0, 1fr); } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, legend { font-weight: 600; font-size: 14px; }
.inp { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding-inline: 10px; }
.inp:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.inp input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font-family: var(--f-mono); font-size: 15px; padding-block: 9px; outline: none; }
.inp span { color: var(--muted); font-family: var(--f-mono); }

fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 420px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { position: relative; display: block; min-width: 0; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: block; height: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 14px; line-height: 1.35; background: var(--bg); }
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt:hover span { border-color: var(--accent); }

/* Profil kartı */
.profile { display: flex; flex-direction: column; gap: 14px; }
.profile .lbl { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.pname { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 6vw, 56px); line-height: 1; letter-spacing: -.02em; color: var(--accent); }
.ptext { max-width: 62ch; color: var(--ink); }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.scale i { height: 8px; border-radius: 2px; background: var(--surface2); }
.scale i.on { background: var(--accent); }
.scale-cap { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-family: var(--f-mono); }

/* Dağılım */
.alloc { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 640px) { .alloc { grid-template-columns: minmax(0, 1fr); justify-items: center; } .alloc ul { width: 100%; } }
.donut { width: 220px; max-width: 100%; height: auto; }
.donut text { fill: var(--ink); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; width: 100%; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: baseline; padding-block: 10px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.dot { width: 12px; height: 12px; border-radius: 2px; align-self: center; }
.rname b { font-weight: 600; display: block; }
.rname small { color: var(--muted); font-size: 13px; line-height: 1.35; display: block; }
.rpct { font-family: var(--f-mono); font-weight: 500; text-align: right; min-width: 3.4em; }
.ramt { font-family: var(--f-mono); color: var(--muted); text-align: right; min-width: 8em; font-size: 14px; }
.row.zero { opacity: .55; }
@media (max-width: 420px) { .row { grid-template-columns: 12px minmax(0, 1fr) auto; } .ramt { grid-column: 2 / 4; text-align: left; min-width: 0; } }
.adjust { background: var(--accent-soft); border-radius: 6px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.adjust:empty { display: none; }

/* Projeksiyon */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; }
.kpi { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k { color: var(--muted); font-size: 13px; }
.kpi .v { font-family: var(--f-mono); font-size: 20px; font-weight: 500; overflow-wrap: anywhere; }
.kpi .s { color: var(--muted); font-size: 12px; font-family: var(--f-mono); }
#chart { width: 100%; min-width: 0; }
#chart svg { display: block; }
.note { color: var(--muted); font-size: 13px; }

/* Varsayımlar */
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font-weight: 600; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.assump { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.arow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 96px; gap: 8px 10px; align-items: center; }
.arow.head { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.arow .nm { font-size: 14px; }
.arow .inp { padding-inline: 8px; }
.arow .inp input { padding-block: 6px; font-size: 14px; }
@media (max-width: 420px) { .arow { grid-template-columns: minmax(0, 1fr) 80px 80px; } }

.disclaimer { font-size: 13px; color: var(--muted); max-width: 90ch; border-top: 1px solid var(--line); padding-top: 16px; }

@media (prefers-reduced-motion: no-preference) {
  .donut circle { transition: stroke-dasharray .35s ease, stroke-dashoffset .35s ease; }
}
</style>

<div class="app" id="app" lang="tr">
  <div class="toprow">
    <header class="top">
      <span class="kicker" data-i18n="kicker"></span>
      <h1 data-i18n="h1"></h1>
      <p data-i18n="lead"></p>
    </header>
    <div class="tools">
      <div class="swatches" role="group" data-i18n-aria="palAria">
        <button type="button" class="sw" data-p="teal" style="--sw:#1F8A98" data-i18n-aria="pal_teal"></button>
        <button type="button" class="sw" data-p="indigo" style="--sw:#5565D0" data-i18n-aria="pal_indigo"></button>
        <button type="button" class="sw" data-p="rose" style="--sw:#D0507F" data-i18n-aria="pal_rose"></button>
        <button type="button" class="sw" data-p="graphite" style="--sw:#5C6B78" data-i18n-aria="pal_graphite"></button>
      </div>
      <div class="lang" role="group" data-i18n-aria="modeAria">
        <button type="button" id="mode-light" aria-pressed="false" data-i18n="modeLight"></button>
        <button type="button" id="mode-dark" aria-pressed="false" data-i18n="modeDark"></button>
      </div>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button type="button" id="lang-tr" aria-pressed="true" lang="tr">Türkçe</button>
        <button type="button" id="lang-en" aria-pressed="false" lang="en">English</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <form class="panel" id="form" onsubmit="return false">
      <h2 data-i18n="formTitle"></h2>
      <div class="money">
        <div class="field">
          <label for="amount" data-i18n="amount"></label>
          <div class="inp"><input id="amount" type="number" inputmode="numeric" min="0" step="1000" value="250000"><span>₺</span></div>
        </div>
        <div class="field">
          <label for="monthly" data-i18n="monthly"></label>
          <div class="inp"><input id="monthly" type="number" inputmode="numeric" min="0" step="500" value="5000"><span>₺</span></div>
        </div>
      </div>

      <fieldset>
        <legend data-i18n="q1l"></legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="q1" value="4"><span data-i18n="q1o1"></span></label>
          <label class="opt"><input type="radio" name="q1" value="3" checked><span data-i18n="q1o2"></span></label>
          <label class="opt"><input type="radio" name="q1" value="2"><span data-i18n="q1o3"></span></label>
          <label class="opt"><input type="radio" name="q1" value="1"><span data-i18n="q1o4"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="q2l"></legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="q2" value="1"><span data-i18n="q2o1"></span></label>
          <label class="opt"><input type="radio" name="q2" value="2"><span data-i18n="q2o2"></span></label>
          <label class="opt"><input type="radio" name="q2" value="3" checked><span data-i18n="q2o3"></span></label>
          <label class="opt"><input type="radio" name="q2" value="4"><span data-i18n="q2o4"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="q3l"></legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="q3" value="1"><span data-i18n="q3o1"></span></label>
          <label class="opt"><input type="radio" name="q3" value="2"><span data-i18n="q3o2"></span></label>
          <label class="opt"><input type="radio" name="q3" value="3" checked><span data-i18n="q3o3"></span></label>
          <label class="opt"><input type="radio" name="q3" value="4"><span data-i18n="q3o4"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="q4l"></legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="q4" value="1"><span data-i18n="q4o1"></span></label>
          <label class="opt"><input type="radio" name="q4" value="2"><span data-i18n="q4o2"></span></label>
          <label class="opt"><input type="radio" name="q4" value="3" checked><span data-i18n="q4o3"></span></label>
          <label class="opt"><input type="radio" name="q4" value="4"><span data-i18n="q4o4"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="q5l"></legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="q5" value="1"><span data-i18n="q5o1"></span></label>
          <label class="opt"><input type="radio" name="q5" value="2"><span data-i18n="q5o2"></span></label>
          <label class="opt"><input type="radio" name="q5" value="3" checked><span data-i18n="q5o3"></span></label>
          <label class="opt"><input type="radio" name="q5" value="4"><span data-i18n="q5o4"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="q6l"></legend>
        <div class="opts">
          <label class="opt"><input type="radio" name="q6" value="1"><span data-i18n="q6o1"></span></label>
          <label class="opt"><input type="radio" name="q6" value="2" checked><span data-i18n="q6o2"></span></label>
          <label class="opt"><input type="radio" name="q6" value="3"><span data-i18n="q6o3"></span></label>
          <label class="opt"><input type="radio" name="q6" value="4"><span data-i18n="q6o4"></span></label>
        </div>
      </fieldset>
    </form>

    <div class="stack">
      <section class="panel" aria-live="polite">
        <div class="profile">
          <span class="lbl" id="plabel"></span>
          <div class="pname" id="pname"></div>
          <div class="scale" id="scale" aria-hidden="true"></div>
          <div class="scale-cap"><span data-i18n="scaleLow"></span><span data-i18n="scaleHigh"></span></div>
          <p class="ptext" id="ptext"></p>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="allocTitle"></h2>
        <div class="alloc">
          <svg class="donut" id="donut" viewBox="0 0 220 220" role="img"></svg>
          <ul class="list" id="alloc"></ul>
        </div>
        <div class="adjust" id="adjust"></div>
      </section>

      <section class="panel">
        <h2 id="projTitle"></h2>
        <div class="kpis" id="kpis"></div>
        <div id="chart"></div>
        <p class="note" data-i18n="chartNote"></p>
        <details>
          <summary data-i18n="assumpSummary"></summary>
          <div class="assump" id="assump"></div>
          <p class="note" style="margin-top:12px" data-i18n="assumpNote"></p>
        </details>
      </section>
    </div>
  </div>

  <p class="disclaimer" data-i18n="disclaimer"></p>
</div>

  function move(w, froms, to, amt) {
    var left = amt, moved = 0;
    froms.forEach(function (i) {
      var tk = Math.min(w[i], left);
      w[i] -= tk; w[to] += tk; left -= tk; moved += tk;
    });
    return moved;
  }

  function compute() {
    var score = 0;
    ['q1', 'q2', 'q3', 'q4', 'q5', 'q6'].forEach(function (q) { score += ans(q); });
    var idx = score <= 9 ? 0 : score <= 13 ? 1 : score <= 17 ? 2 : score <= 21 ? 3 : 4;
    var w = PROFILES[idx].w.slice();
    var notes = [];
    if (ans('q2') === 1) {
      var m1 = move(w, [3, 5], 1, w[3] + w[5]);
      if (m1 > 0) notes.push(T[lang].note1(m1));
    }
    if (ans('q5') === 1) {
      var m2 = move(w, [3, 5], 1, 10);
      if (m2 > 0) notes.push(T[lang].note2(m2));
    }
    return { score: score, idx: idx, w: w, notes: notes };
  }

  function series(rate, months, P, C) {
    rate = Math.max(rate, -0.95);
    var mr = Math.pow(1 + rate, 1 / 12) - 1, v = P, out = [v];
    for (var i = 1; i <= months; i++) { v = v * (1 + mr) + C; out.push(v); }
    return out;
  }
  function niceStep(raw) {
    var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p;
    var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return n * p;
  }

  function drawChart() {

    var W = Math.max(280, box.clientWidth || 600), H = 290;

    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var maxV = Math.max(d.sGood[d.months], d.sBase[d.months], d.sPrin[d.months], 1);
    var step = niceStep(maxV / 4), top = Math.ceil(maxV / step) * step;
    var X = function (mo) { return m.l + pw * mo / d.months; };
    var Yy = function (v) { return m.t + ph * (1 - v / top); };
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('chartAria') + '">';
    for (var v = 0; v <= top + 1e-6; v += step) {
      s += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Yy(v) + '" y2="' + Yy(v) + '" style="stroke:var(--line)" stroke-width="1"/>';

    var rev = ''; for (var i = d.months; i >= 0; i--) rev += 'L' + X(i).toFixed(1) + ' ' + Yy(d.sBad[i]).toFixed(1);
    s += '<path d="' + path(d.sGood) + rev + 'Z" style="fill:var(--accent)" fill-opacity=".10" stroke="none"/>';
    s += '<path d="' + path(d.sPrin) + '" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="2 4"/>';
    s += '<path d="' + path(d.sBad) + '" fill="none" style="stroke:var(--bad)" stroke-width="1.75" stroke-dasharray="6 4"/>';
    s += '<path d="' + path(d.sGood) + '" fill="none" style="stroke:var(--good)" stroke-width="1.75" stroke-dasharray="6 4"/>';
    s += '<path d="' + path(d.sBase) + '" fill="none" style="stroke:var(--accent)" stroke-width="3" stroke-linejoin="round"/>';
    s += '<circle cx="' + X(d.months) + '" cy="' + Yy(d.sBase[d.months]) + '" r="4.5" style="fill:var(--accent)"/>';

  }

  $('lang-tr').addEventListener('click', function () { setLang('tr'); });
  $('lang-en').addEventListener('click', function () { setLang('en'); });
  document.addEventListener('input', update);
  document.addEventListener('change', update);
  if (window.ResizeObserver) new ResizeObserver(function () { drawChart(); }).observe($('chart'));
  else window.addEventListener('resize', drawChart);

  /* Renk paleti ve açık/koyu tema */
  var PALETTES = ['teal', 'indigo', 'rose', 'graphite'];
  var palette = 'teal', mode = null, root = document.documentElement;
  try {
    var sp = localStorage.getItem('oranla-palette'); if (PALETTES.indexOf(sp) > -1) palette = sp;
    var sm = localStorage.getItem('oranla-mode'); if (sm === 'light' || sm === 'dark') mode = sm;
  } catch (e) {}
  function applyColors() {
    if (palette === 'teal') root.removeAttribute('data-palette'); else root.setAttribute('data-palette', palette);
    if (mode) root.setAttribute('data-theme', mode);
    document.querySelectorAll('.sw').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-p') === palette ? 'true' : 'false'); });
    var eff = root.getAttribute('data-theme') || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    $('mode-light').setAttribute('aria-pressed', eff === 'light' ? 'true' : 'false');
    $('mode-dark').setAttribute('aria-pressed', eff === 'dark' ? 'true' : 'false');
  }
  document.querySelectorAll('.sw').forEach(function (b) {
    b.addEventListener('click', function () {
      palette = b.getAttribute('data-p');
      try { localStorage.setItem('oranla-palette', palette); } catch (e) {}
      applyColors();
    });
  });
  ['light', 'dark'].forEach(function (m) {
    $('mode-' + m).addEventListener('click', function () {
      mode = m;
      try { localStorage.setItem('oranla-mode', m); } catch (e) {}
      applyColors();
    });
  });

  setFormats();
  applyStatic();
  applyColors();
  update();
})();
</script>

</body></html>
